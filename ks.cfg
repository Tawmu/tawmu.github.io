#version=RHEL10
# AlmaLinux 10 (x86_64_v2) unattended install for a SERIAL-ONLY VPS.
# Host at https://<user>.github.io/<repo>/ks.cfg and pass inst.ks=<that URL>.

text
eula --agreed
firstboot --disable
reboot

# --- Localisation ---
lang en_US.UTF-8
keyboard us
timezone Etc/UTC --utc

# --- Network (config baked into the installed system) ---
# --device=link binds the first NIC that has a carrier, so you don't need to
# know its name. For DHCP this is all you need.
network --bootproto=static --device=eth0 --activate \
  --ip=118.91.187.142 --netmask=255.255.255.192 --gateway=118.91.187.129 \
  --nameserver=1.1.1.1,1.0.0.1 --hostname=ifog-ams-pop-1
#
# STATIC alternative: comment the line above, fill this in, AND add a matching
# ip=<ip>::<gw>:<mask>::<iface>:none nameserver=<dns> to the installer kernel
# cmdline in your GRUB entry (the initramfs needs it to fetch THIS file):
# network --bootproto=static --device=link --activate \
#   --ip=A.B.C.D --netmask=255.255.255.0 --gateway=A.B.C.1 \
#   --nameserver=1.1.1.1,9.9.9.9 --hostname=ifog-ams-pop-1

# --- Accounts ---
# rootpw is what you log in with over SERIAL if the network/SSH ever breaks,
# so do not omit it. Generate the hash: openssl passwd -6
rootpw --iscrypted $6$nUX.BQx7NtrVWH8q$/atcPK7L/4Yl.CMkzq8MwNJvrZKGAStoru1YOYgq3J7sngcm5Et8JJh6waQ0RGhGpwQbkHR/adFsB1SNO1ece1
sshkey --username=root "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILHJfWjs4Jnf7NYyDd+t19CdthBl3A4jia/EluQzdJc6"

# --- Install source (v2 tree — MUST match your CPU) ---
url --url="https://repo.almalinux.org/almalinux/10/BaseOS/x86_64_v2/os"
repo --name=AppStream --baseurl="https://repo.almalinux.org/almalinux/10/AppStream/x86_64_v2/os"

# --- Storage (DESTRUCTIVE — wipes sda) ---
zerombr
clearpart --all --initlabel --drives=sda
autopart --type=plain --nohome
#
# BIOS / MBR (default for this box). The console= args land in the INSTALLED
# system's kernel cmdline, so serial keeps working after first reboot.
bootloader --location=mbr --boot-drive=sda --append="console=tty0 console=ttyS0"
#
# UEFI alternative: comment the bootloader line above, uncomment this, and make
# sure the installer kernel itself boots in UEFI mode. autopart adds the ESP.
# bootloader --boot-drive=sda --append="console=tty0 console=ttyS0,115200n8"

# --- Security / services ---
selinux --enforcing
services --enabled=sshd,chronyd

# kdump just reserves memory you don't want to spare on a small VPS
%addon com_redhat_kdump --disable
%end

# --- Packages ---
%packages
@^minimal-environment
openssh-server
chrony
qemu-guest-agent
vim-enhanced
bind-utils
tar
%end

# --- Post-install ---
%post --erroronfail --log=/root/ks-post.log
# Root login by key only (password logins over SSH stay disabled; serial still
# uses the rootpw above).
install -d -m 0700 /etc/ssh/sshd_config.d
printf 'PermitRootLogin prohibit-password\n' > /etc/ssh/sshd_config.d/10-root-key.conf

# Belt-and-braces: ensure a login prompt on the serial port.
systemctl enable serial-getty@ttyS0.service
%end
